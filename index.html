<style>
:root { color-scheme: light; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f5; color: #1a1a2e; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 20px;
}
.container { width: 100%; max-width: 820px; }
h1 {
  font-size: 28px; font-weight: 700; text-align: center;
  margin-bottom: 8px; color: #1a1a2e;
}
.subtitle {
  text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 28px;
}
.search-box { position: relative; margin-bottom: 20px; }
.search-box svg.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; color: #9ca3af;
}
#searchInput {
  width: 100%; padding: 14px 16px 14px 46px; font-size: 16px;
  border: 2px solid #e5e7eb; border-radius: 12px; outline: none;
  background: #fff; transition: border-color 0.2s, box-shadow 0.2s;
}
#searchInput:focus {
  border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}
.result-count {
  font-size: 13px; color: #6b7280; margin-bottom: 10px; padding-left: 4px;
}
.card-list { display: flex; flex-direction: column; gap: 8px; }
.card {
  background: #fff; border-radius: 10px; padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  transition: box-shadow 0.15s, transform 0.15s;
}
.card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
.card .name {
  min-width: 180px; font-weight: 600; font-size: 14px; color: #1a1a2e;
}
.card .id-btn {
  font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
  font-size: 13px; background: #eef2ff; color: #4f46e5;
  padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer;
  font-weight: 500; transition: background 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.card .id-btn:hover { background: #e0e7ff; }
.card .id-btn svg { width: 12px; height: 12px; }
.card .link {
  margin-left: auto; color: #6366f1; font-size: 13px;
  text-decoration: none; display: flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 6px; transition: background 0.15s;
}
.card .link:hover { background: #f5f3ff; text-decoration: underline; }
.card .link svg { width: 14px; height: 14px; }
.empty-state {
  text-align: center; padding: 60px 20px; color: #9ca3af;
}
.empty-state svg { width: 56px; height: 56px; margin-bottom: 14px; color: #d1d5db; }
.empty-state p { font-size: 15px; line-height: 1.6; }
.empty-state .hint { font-size: 12px; color: #b0b0b8; margin-top: 6px; }
mark { background: #fef08a; border-radius: 2px; padding: 0 2px; }
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1e1b4b; color: #fff; padding: 10px 24px; border-radius: 8px;
  font-size: 14px; opacity: 0; transition: all 0.3s ease; pointer-events: none;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 600px) {
  .card { flex-wrap: wrap; }
  .card .name { min-width: 100%; }
  .card .link { margin-left: 0; }
}
</style>
</head>
<body>

  </div>
  <div class="result-count" id="resultCount"></div>
  <div id="listWrap"></div>
</div>

function buildLink(id) {
  const [a, b] = id.split('-');
  return `https://zoo.ibu.ctripcorp.com/promo/detail/${a}/mechanics/mechanism/edit/${b}`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

function highlight(text, keywords) {
  let out = escapeHtml(text);
  keywords.forEach(kw => {
    if (!kw) return;
    const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
  });
  return out;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function copyId(id) {
  navigator.clipboard.writeText(id).then(() => showToast(`✅ 已复制: ${id}`))
  .catch(() => {
    const ta = document.createElement('textarea');
    ta.value = id; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast(`✅ 已复制: ${id}`);
  });
}

function render(results, keywords) {
  const wrap = document.getElementById('listWrap');
  const countEl = document.getElementById('resultCount');

  if (keywords.length === 0) {
    countEl.textContent = '';
    wrap.innerHTML = `<div class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.803 5.803a7.5 7.5 0 009.999 9.999z" /></svg>
      <p>请输入名称进行搜索</p>
      <p class="hint">支持模糊匹配 · 空格分隔多关键词</p>
    </div>`;
    return;
  }

  if (results.length === 0) {
    countEl.textContent = '';
    wrap.innerHTML = `<div class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0012.016 15a4.486 4.486 0 00-3.198 1.318M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      <p>没有匹配的结果</p>
    </div>`;
    return;
  }

  countEl.textContent = `找到 ${results.length} 条结果`;
  let html = '<div class="card-list">';
  results.forEach(r => {
    const link = buildLink(r.id);
    html += `<div class="card">
      <div class="name">${highlight(r.name, keywords)}</div>
      <button class="id-btn" onclick="copyId('${r.id}')" title="点击复制 PlayID">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>

      </button>
      <a class="link" href="${link}" target="_blank" rel="noopener" title="在新窗口打开">
        打开链接
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" /></svg>
      </a>
    </div>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function doSearch() {
  const raw = document.getElementById('searchInput').value.trim();
  if (!raw) { render([], []); return; }
  const keywords = raw.toLowerCase().split(/\s+/).filter(Boolean);
  const results = DATA.filter(item => {
    const n = item.name.toLowerCase();
    const i = item.id.toLowerCase();
    return keywords.every(kw => n.includes(kw) || i.includes(kw));
  });
  // prefix match first
  const joined = keywords.join('_');
  results.sort((a, b) => {
    const aStarts = a.name.toLowerCase().startsWith(keywords[0]) ? 0 : 1;
    const bStarts = b.name.toLowerCase().startsWith(keywords[0]) ? 0 : 1;
    if (aStarts !== bStarts) return aStarts - bStarts;
    return a.name.localeCompare(b.name);
  });
  render(results, keywords);
}

document.getElementById('searchInput').addEventListener('input', doSearch);
render([], []);
</script>
